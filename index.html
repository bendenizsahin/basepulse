<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="base:app_id" content="6a96ea1dcfa2c998e36b5991" />
<title>Morebase Pro & Studio</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #070a12;
    --card: #101626;
    --border: #1f2a44;
    --blue: #0052ff;
    --blue-light: #4c8bff;
    --text: #e8ecf4;
    --text-dim: #8992a9;
    --green: #2ecc71;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0d1633 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 580px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  #connectBtn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #connectBtn.connected { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active { background: var(--blue); color: white; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  textarea, input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
  }

  .streak-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 14px 0;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .streak-box { text-align: center; }
  .streak-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
  .streak-num { font-size: 40px; font-weight: 800; color: var(--blue-light); margin-top: 4px; }

  .timer-box { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .timer-box span { color: var(--text); font-weight: 700; }

  .status-msg { text-align: center; font-size: 12px; padding: 8px; border-radius: 8px; margin-top: 10px; }
  .status-msg.success { background: rgba(46,204,113,0.1); color: var(--green); }
  .status-msg.error { background: rgba(255,92,92,0.1); color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>Morebase Pro</div>
    <button id="connectBtn">Connect Wallet</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="gm">GM Streak</div>
    <div class="tab" data-tab="messages">Messages</div>
    <div class="tab" data-tab="deploy">Deploy & Mint</div>
  </div>

  <section id="tab-gm">
    <div class="card">
      <h2>Daily GM Check-in</h2>
      
      <div id="noWalletStreak" style="text-align: center; padding: 30px 0; color: var(--text-dim);">
        🔒 Connect wallet to view your GM streaks
      </div>

      <div id="walletStreakContainer" class="streak-container hidden">
        <div class="streak-box">
          <div class="streak-label">Current Streak</div>
          <div class="streak-num" id="currentStreakNum">0</div>
        </div>
        <div style="width: 1px; height: 40px; background: var(--border);"></div>
        <div class="streak-box">
          <div class="streak-label">Total Check-ins</div>
          <div class="streak-num" id="totalStreakNum" style="color: var(--text);">0</div>
        </div>
      </div>

      <div class="timer-box">Resets in: <span id="utcTimer">--:--:--</span> (UTC 00:00)</div>
      <button class="btn-primary" id="checkInBtn" disabled>Connect Wallet First</button>
      <div id="gmStatus"></div>
    </div>
  </section>

  <section id="tab-messages" class="hidden">
    <div class="card">
      <h2>Onchain Wall</h2>
      <textarea id="msgInput" maxlength="200" placeholder="Write onchain message..."></textarea>
      <button class="btn-primary" id="postMsgBtn" disabled>Post Message</button>
      <div id="msgStatus"></div>
    </div>
  </section>

  <section id="tab-deploy" class="hidden">
    <div class="card">
      <h2>1. Mint Morebase Pass NFT</h2>
      <button class="btn-primary" id="mintNftBtn" disabled>Mint Morebase Pass</button>
      <div id="mintStatus"></div>
    </div>
  </section>
</div>

<script>
const CONTRACT_ADDRESS = "0x2D6Dfe8C0d86cc1501A1c85af161b4DDe19Fe0eD"; 
const CONFIG = { chainIdHex: "0x2105" }; 

const CONTRACT_ABI = [
  "function checkIn() external payable",
  "function postMessage(string calldata _message) external payable",
  "function mintMorebasePass() external payable"
];

let provider, signer, userAddress, contract;

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("connectBtn").addEventListener("click", connectWallet);
  startUTCTimer();

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll("section[id^='tab-']").forEach(s => s.classList.add("hidden"));
      document.getElementById("tab-" + tab.dataset.tab).classList.remove("hidden");
    });
  });
});

function getTodayString() {
  const d = new Date();
  return `${d.getUTCFullYear()}-${d.getUTCMonth()+1}-${d.getUTCDate()}`;
}

function updateStreakDisplay() {
  if (!userAddress) return;
  const today = getTodayString();
  
  let currentStreak = parseInt(localStorage.getItem(`streak_curr_${userAddress}`) || "0");
  let totalCheckIns = parseInt(localStorage.getItem(`streak_tot_${userAddress}`) || "0");
  let lastCheck = localStorage.getItem(`streak_last_${userAddress}`);

  document.getElementById("currentStreakNum").textContent = currentStreak;
  document.getElementById("totalStreakNum").textContent = totalCheckIns;

  const btn = document.getElementById("checkInBtn");
  if (lastCheck === today) {
    btn.disabled = true;
    btn.textContent = "Already Checked In Today ☀️";
  } else {
    btn.disabled = false;
    btn.textContent = "GM Check-in ☀️";
  }
}

function startUTCTimer() {
  setInterval(() => {
    const now = new Date();
    const utcNow = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds());
    const utcNext = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0);
    const diff = utcNext - utcNow;

    const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
    const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
    const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

    document.getElementById("utcTimer").textContent = `${hours}:${minutes}:${seconds}`;
  }, 1000);
}

async function connectWallet() {
  if (!window.ethereum) return alert("Install Web3 Wallet!");

  try {
    const currentChain = await window.ethereum.request({ method: "eth_chainId" });
    if (currentChain.toLowerCase() !== CONFIG.chainIdHex.toLowerCase()) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: CONFIG.chainIdHex }]
      });
    }

    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    userAddress = accounts[0];

    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

    document.getElementById("connectBtn").textContent = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    document.getElementById("connectBtn").classList.add("connected");

    document.getElementById("noWalletStreak").classList.add("hidden");
    document.getElementById("walletStreakContainer").classList.remove("hidden");

    document.getElementById("postMsgBtn").disabled = false;
    document.getElementById("mintNftBtn").disabled = false;

    updateStreakDisplay();

  } catch (err) {
    console.error(err);
  }
}

document.getElementById("checkInBtn").addEventListener("click", async () => {
  const btn = document.getElementById("checkInBtn");
  btn.disabled = true;
  btn.textContent = "Checking in...";

  try {
    const tx = await contract.checkIn();
    await tx.wait();

    let curr = parseInt(localStorage.getItem(`streak_curr_${userAddress}`) || "0") + 1;
    let tot = parseInt(localStorage.getItem(`streak_tot_${userAddress}`) || "0") + 1;

    localStorage.setItem(`streak_curr_${userAddress}`, curr);
    localStorage.setItem(`streak_tot_${userAddress}`, tot);
    localStorage.setItem(`streak_last_${userAddress}`, getTodayString());

    showStatus("gmStatus", "GM Success! 🎉", "success");
    updateStreakDisplay();
  } catch (err) {
    showStatus("gmStatus", "Failed: " + (err.reason || err.message), "error");
    updateStreakDisplay();
  }
});

document.getElementById("postMsgBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msgInput").value;
  if (!msg) return;
  try {
    const tx = await contract.postMessage(msg);
    await tx.wait();
    showStatus("msgStatus", "Message posted!", "success");
  } catch (err) { showStatus("msgStatus", "Failed", "error"); }
});

document.getElementById("mintNftBtn").addEventListener("click", async () => {
  try {
    const tx = await contract.mintMorebasePass();
    await tx.wait();
    showStatus("mintStatus", "NFT Minted!", "success");
  } catch (err) { showStatus("mintStatus", "Failed", "error"); }
});

function showStatus(elId, message, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 4000);
}
</script>
</body>
</html>
