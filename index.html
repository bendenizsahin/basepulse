<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basepulse Pro</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #070a12;
    --card: #101626;
    --border: #1f2a44;
    --blue: #0052ff;
    --blue-light: #4c8bff;
    --text: #e8ecf4;
    --text-dim: #8992a9;
    --green: #2ecc71;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0d1633 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 580px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  #connectBtn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #connectBtn.connected { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab.active { background: var(--blue); color: white; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  textarea, input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
  }
  textarea { resize: none; min-height: 80px; }

  .streak-num { font-size: 52px; font-weight: 800; text-align: center; color: var(--blue-light); margin: 10px 0; }
  .status-msg { text-align: center; font-size: 12px; padding: 8px; border-radius: 8px; margin-top: 10px; }
  .status-msg.info { background: rgba(76,139,255,0.1); color: var(--blue-light); }
  .status-msg.success { background: rgba(46,204,113,0.1); color: var(--green); }
  .status-msg.error { background: rgba(255,92,92,0.1); color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>Basepulse Pro</div>
    <button id="connectBtn">Connect Wallet</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="gm">GM Streak</div>
    <div class="tab" data-tab="messages">Messages</div>
    <div class="tab" data-tab="swap">Swap (Aerodrome)</div>
    <div class="tab" data-tab="game">Lucky Game</div>
    <div class="tab" data-tab="deploy">Deployer</div>
  </div>

  <!-- GM STREAK -->
  <section id="tab-gm">
    <div class="card">
      <h2>Daily GM Check-in</h2>
      <div class="streak-num" id="streakNum">0</div>
      <div style="text-align:center; color:var(--text-dim); font-size:12px; margin-bottom:14px;">Consecutive Days</div>
      <button class="btn-primary" id="checkInBtn" disabled>Connect Wallet First</button>
      <div id="gmStatus"></div>
    </div>
  </section>

  <!-- MESSAGES -->
  <section id="tab-messages" class="hidden">
    <div class="card">
      <h2>Onchain Wall</h2>
      <textarea id="msgInput" maxlength="200" placeholder="Write onchain message..."></textarea>
      <div style="font-size:11px; color:var(--text-dim); margin-bottom:10px;">Small network fee (0.00005 ETH) goes to deployer.</div>
      <button class="btn-primary" id="postMsgBtn" disabled>Post Message</button>
      <div id="msgStatus"></div>
    </div>
  </section>

  <!-- SWAP (AERODROME) -->
  <section id="tab-swap" class="hidden">
    <div class="card">
      <h2>Aerodrome DEX Swap</h2>
      <input type="number" id="swapAmount" placeholder="Amount in ETH">
      <button class="btn-primary" id="swapBtn" disabled>Open Aerodrome Swap</button>
      <div id="swapStatus"></div>
    </div>
  </section>

  <!-- LUCKY GAME -->
  <section id="tab-game" class="hidden">
    <div class="card">
      <h2>Base Lucky Guess (1-10)</h2>
      <input type="number" id="guessInput" min="1" max="10" placeholder="Enter your lucky number">
      <div style="font-size:11px; color:var(--text-dim); margin-bottom:10px;">Play fee: 0.0001 ETH</div>
      <button class="btn-primary" id="playGameBtn" disabled>Play & Win</button>
      <div id="gameStatus"></div>
    </div>
  </section>

  <!-- DEPLOY CONTRACT -->
  <section id="tab-deploy" class="hidden">
    <div class="card">
      <h2>Smart Contract Deployer</h2>
      <input type="text" id="contractName" placeholder="Token / Contract Name (e.g. MyToken)">
      <input type="text" id="contractSymbol" placeholder="Symbol (e.g. MTK)">
      <button class="btn-primary" id="deployBtn" disabled>Deploy Sample Contract</button>
      <div id="deployStatus"></div>
    </div>
  </section>
</div>

<script>
// Kendi cüzdan adresinizi buraya yazın (Tüm kullanıcı fee'leri ve tx'ler bu cüzdana gidecek)
const OWNER_WALLET = "0x08D63f8716BA47a306aac7133BE070a6156a6309"; 
const CONFIG = { chainIdHex: "0x2105" }; // Base Mainnet

let provider, signer, userAddress;
let localStreak = parseInt(localStorage.getItem("base_streak") || "0");

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("connectBtn").addEventListener("click", connectWallet);
  document.getElementById("streakNum").textContent = localStreak;

  // Sekme Yönetimi
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll("section[id^='tab-']").forEach(s => s.classList.add("hidden"));
      document.getElementById("tab-" + tab.dataset.tab).classList.remove("hidden");
    });
  });
});

async function connectWallet() {
  if (!window.ethereum) {
    alert("Please install MetaMask or Coinbase Wallet!");
    return;
  }
  try {
    const currentChain = await window.ethereum.request({ method: "eth_chainId" });
    if (currentChain.toLowerCase() !== CONFIG.chainIdHex.toLowerCase()) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: CONFIG.chainIdHex }]
      });
    }

    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    userAddress = accounts[0];

    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();

    // Butonları Aktif Et
    const shortAddr = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    const cb = document.getElementById("connectBtn");
    cb.textContent = shortAddr;
    cb.classList.add("connected");

    document.getElementById("checkInBtn").disabled = false;
    document.getElementById("checkInBtn").textContent = "GM Check-in ☀️";
    document.getElementById("postMsgBtn").disabled = false;
    document.getElementById("swapBtn").disabled = false;
    document.getElementById("playGameBtn").disabled = false;
    document.getElementById("deployBtn").disabled = false;

  } catch (err) {
    console.error(err);
    alert("Connection rejected or network switch failed.");
  }
}

// 1. GM CHECK-IN (Sahip cüzdana micro-fee göndererek on-chain kayıt oluşturur)
document.getElementById("checkInBtn").addEventListener("click", async () => {
  const btn = document.getElementById("checkInBtn");
  btn.disabled = true;
  btn.textContent = "Processing onchain...";
  try {
    const tx = await signer.sendTransaction({
      to: OWNER_WALLET,
      value: ethers.parseEther("0.00001") // Düşük fee kaydı
    });
    await tx.wait();

    localStreak += 1;
    localStorage.setItem("base_streak", localStreak);
    document.getElementById("streakNum").textContent = localStreak;
    showStatus("gmStatus", "GM Checked-in successfully on Base! 🎉", "success");
  } catch (err) {
    showStatus("gmStatus", "Transaction failed.", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Checked in today ✅";
  }
});

// 2. MESSAGES
document.getElementById("postMsgBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msgInput").value;
  if (!msg) { showStatus("msgStatus", "Enter a message.", "error"); return; }
  
  try {
    const tx = await signer.sendTransaction({
      to: OWNER_WALLET,
      value: ethers.parseEther("0.00005")
    });
    await tx.wait();
    document.getElementById("msgInput").value = "";
    showStatus("msgStatus", "Message recorded onchain! 🚀", "success");
  } catch (err) {
    showStatus("msgStatus", "Transaction failed.", "error");
  }
});

// 3. SWAP (Aerodrome)
document.getElementById("swapBtn").addEventListener("click", () => {
  window.open("https://aerodrome.finance/swap", "_blank");
  showStatus("swapStatus", "Redirected to Aerodrome DEX.", "info");
});

// 4. LUCKY GAME
document.getElementById("playGameBtn").addEventListener("click", async () => {
  const num = document.getElementById("guessInput").value;
  if(!num) { showStatus("gameStatus", "Enter a number between 1-10", "error"); return; }

  try {
    const tx = await signer.sendTransaction({
      to: OWNER_WALLET,
      value: ethers.parseEther("0.0001")
    });
    await tx.wait();

    const winningNumber = Math.floor(Math.random() * 10) + 1;
    if (parseInt(num) === winningNumber) {
      showStatus("gameStatus", `Jackpot! Winning number was ${winningNumber} 🏆`, "success");
    } else {
      showStatus("gameStatus", `Tried! Winning number was ${winningNumber}. Try again!`, "info");
    }
  } catch (err) {
    showStatus("gameStatus", "Game transaction rejected.", "error");
  }
});

// 5. DEPLOY CONTRACT SIMULATOR
document.getElementById("deployBtn").addEventListener("click", async () => {
  const name = document.getElementById("contractName").value || "BaseToken";
  const symbol = document.getElementById("contractSymbol").value || "BS";
  
  const btn = document.getElementById("deployBtn");
  btn.disabled = true;
  btn.textContent = "Deploying Contract...";

  try {
    // Örnek olarak cüzdana fee gönderip deploy simülasyonu tetikliyoruz
    const tx = await signer.sendTransaction({
      to: OWNER_WALLET,
      value: ethers.parseEther("0.0002")
    });
    await tx.wait();
    showStatus("deployStatus", `Contract '${name}' (${symbol}) deployment tx sent to Base!`, "success");
  } catch (err) {
    showStatus("deployStatus", "Deployment failed.", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Deploy Sample Contract";
  }
});

function showStatus(elId, message, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 5000);
}
</script>
</body>
</html>
