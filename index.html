<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basepulse</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --card: #12182a;
    --border: #232b42;
    --blue: #0052ff;
    --blue-light: #4c8bff;
    --text: #e8ecf4;
    --text-dim: #8992a9;
    --green: #2ecc71;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0e1830 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  #connectBtn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }
  #connectBtn:hover { opacity: .85; }
  #connectBtn.connected { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
  }
  .tab.active { background: var(--blue); color: white; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* GM Streak */
  .streak-hero { text-align: center; padding: 12px 0 20px; }
  .streak-number {
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #4c8bff, #0052ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .streak-label { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .stats-row { display: flex; gap: 10px; margin: 18px 0; }
  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-box .val { font-size: 20px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .countdown {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .countdown span { color: var(--blue-light); font-weight: 700; font-variant-numeric: tabular-nums; }
  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  .badges-row { display: flex; gap: 10px; margin-top: 18px; }
  .badge {
    flex: 1;
    text-align: center;
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    opacity: 0.35;
  }
  .badge.earned { opacity: 1; border-color: var(--blue); background: rgba(0,82,255,0.1); }
  .badge .emoji { font-size: 22px; }
  .badge .days { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* Messages */
  textarea {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    min-height: 90px;
  }
  .char-count { text-align: right; font-size: 12px; color: var(--text-dim); margin: 6px 0 14px; }
  .fee-note { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .message-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .message-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .message-item .author { font-size: 11px; color: var(--blue-light); font-family: monospace; }
  .message-item .text { font-size: 14px; margin-top: 4px; word-break: break-word; }
  .message-item .time { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  /* Swap */
  .swap-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .swap-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .swap-row input {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    width: 100%;
    outline: none;
  }
  select.token-select {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 600;
    font-size: 13px;
  }
  .swap-arrow {
    text-align: center;
    margin: 6px 0;
    color: var(--text-dim);
    font-size: 18px;
  }
  .swap-details { font-size: 12px; color: var(--text-dim); margin: 14px 0; display: flex; flex-direction: column; gap: 6px; }
  .swap-details div { display: flex; justify-content: space-between; }

  .status-msg {
    text-align: center;
    font-size: 13px;
    padding: 10px;
    border-radius: 10px;
    margin-top: 12px;
  }
  .status-msg.info { background: rgba(76,139,255,0.1); color: var(--blue-light); }
  .status-msg.success { background: rgba(46,204,113,0.1); color: var(--green); }
  .status-msg.error { background: rgba(255,92,92,0.1); color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>Basepulse</div>
    <button id="connectBtn">Connect Wallet</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="gm">GM Streak</div>
    <div class="tab" data-tab="messages">Messages</div>
    <div class="tab" data-tab="swap">Swap</div>
  </div>

  <!-- GM STREAK TAB -->
  <section id="tab-gm">
    <div class="card">
      <h2>Your Streak</h2>
      <div class="streak-hero">
        <div class="streak-number" id="streakNum">–</div>
        <div class="streak-label">days in a row</div>
      </div>
      <div class="countdown">Resets in <span id="countdown">--:--:--</span></div>
      <div class="stats-row">
        <div class="stat-box"><div class="val" id="bestStreak">–</div><div class="lbl">Best Streak</div></div>
        <div class="stat-box"><div class="val" id="totalCheckins">–</div><div class="lbl">Total Check-ins</div></div>
      </div>
      <button class="btn-primary" id="checkInBtn">Connect wallet first</button>
      <div class="badges-row" id="badgesRow">
        <div class="badge" data-days="7"><div class="emoji">🥉</div><div class="days">7 days</div></div>
        <div class="badge" data-days="30"><div class="emoji">🥈</div><div class="days">30 days</div></div>
        <div class="badge" data-days="100"><div class="emoji">🥇</div><div class="days">100 days</div></div>
        <div class="badge" data-days="365"><div class="emoji">🏆</div><div class="days">365 days</div></div>
      </div>
      <div id="gmStatus"></div>
    </div>
  </section>

  <!-- MESSAGES TAB -->
  <section id="tab-messages" class="hidden">
    <div class="card">
      <h2>Post a message</h2>
      <textarea id="msgInput" maxlength="280" placeholder="What's happening onchain?"></textarea>
      <div class="char-count"><span id="charCount">0</span>/280</div>
      <div class="fee-note">Fee: 0.001 USDC per message</div>
      <button class="btn-primary" id="postMsgBtn">Connect wallet first</button>
      <div id="msgStatus"></div>
      <div class="message-list" id="messageList"></div>
    </div>
  </section>

  <!-- SWAP TAB -->
  <section id="tab-swap" class="hidden">
    <div class="card">
      <h2>Swap</h2>
      <div class="swap-box">
        <div class="swap-row">
          <input type="number" id="swapAmountIn" placeholder="0.0">
          <select class="token-select" id="tokenIn">
            <option value="ETH">ETH</option>
            <option value="USDC">USDC</option>
          </select>
        </div>
      </div>
      <div class="swap-arrow">↓</div>
      <div class="swap-box">
        <div class="swap-row">
          <input type="number" id="swapAmountOut" placeholder="0.0" disabled>
          <select class="token-select" id="tokenOut">
            <option value="USDC">USDC</option>
            <option value="ETH">ETH</option>
          </select>
        </div>
      </div>
      <div class="swap-details">
        <div><span>Fee (0.1%)</span><span id="feeAmount">–</span></div>
        <div><span>You receive</span><span id="estimatedOut">–</span></div>
      </div>
      <button class="btn-primary" id="swapBtn">Connect wallet first</button>
      <div id="swapStatus"></div>
    </div>
  </section>
</div>

<script>
// ============================================================
// CONFIG — Adressen hier eintragen, sobald jeder Contract deployed ist
// ============================================================
const CONFIG = {
  chainId: 84532n, // Base Sepolia (Testnet). Für Mainnet: 8453n
  rpcUrl: "https://sepolia.base.org",
  contracts: {
    gmStreak: "0xea35fa5803EEAcc6195D32078a001834fe790c9A", // ✅ deployed
    onchainMessages: "", // ⏳ noch nicht deployed
    aerodromeSwap: "",   // ⏳ noch nicht deployed
    usdc: ""             // USDC-Adresse auf dem jeweiligen Netzwerk
  }
};

const GM_STREAK_ABI = [
  "function checkIn() external",
  "function getStreakInfo(address user) view returns (uint256 currentStreak, uint256 best, uint256 totalCheckInsCount, bool checkedInToday, uint256 nextResetAt, uint256 secondsUntilReset)",
  "function getBadges(address user) view returns (bool[] owned, uint256[] milestoneDays)"
];

const ONCHAIN_MESSAGES_ABI = [
  "function postMessage(string text) external",
  "function messageFee() view returns (uint256)",
  "function getRecentMessages(uint256 offset, uint256 limit) view returns (address[] authors, string[] texts, uint256[] timestamps)"
];

const USDC_ABI = [
  "function approve(address spender, uint256 amount) external returns (bool)",
  "function allowance(address owner, address spender) view returns (uint256)"
];

let provider, signer, userAddress;
let gmContract, messagesContract, usdcContract;
let countdownInterval;

// ---------- Wallet Connect ----------
const connectBtn = document.getElementById("connectBtn");
connectBtn.addEventListener("click", connectWallet);

  async function connectWallet() {
  console.log('CLICK');
  if (!window.ethereum) {
    alert("No wallet found. Please install MetaMask or Coinbase Wallet.");
    return;
  }
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    await window.ethereum.request({ method: "wallet_requestPermissions", params: [{ eth_accounts: {} }] }).catch(() => {});
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    const network = await provider.getNetwork();
    if (network.chainId !== CONFIG.chainId) {
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0x" + CONFIG.chainId.toString(16) }]
        });
      } catch (switchError) {
        alert("Please switch to the correct network manually.");
        return;
      }
    }

    connectBtn.textContent = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    connectBtn.classList.add("connected");

    initContracts();
    refreshStreakInfo();
    document.getElementById("checkInBtn").disabled = false;
    document.getElementById("postMsgBtn").disabled = false;
    document.getElementById("swapBtn").disabled = false;
    document.getElementById("checkInBtn").textContent = "GM ☀️";
    document.getElementById("postMsgBtn").textContent = "Post (0.001 USDC)";
    document.getElementById("swapBtn").textContent = "Swap";
  } catch (err) {
    console.error(err);
    showStatus("gmStatus", "Connection failed.", "error");
  }
}

function initContracts() {
  if (CONFIG.contracts.gmStreak) {
    gmContract = new ethers.Contract(CONFIG.contracts.gmStreak, GM_STREAK_ABI, signer);
  }
  if (CONFIG.contracts.onchainMessages) {
    messagesContract = new ethers.Contract(CONFIG.contracts.onchainMessages, ONCHAIN_MESSAGES_ABI, signer);
  }
  if (CONFIG.contracts.usdc) {
    usdcContract = new ethers.Contract(CONFIG.contracts.usdc, USDC_ABI, signer);
  }
}

// ---------- Tabs ----------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll("section[id^='tab-']").forEach(s => s.classList.add("hidden"));
    document.getElementById("tab-" + tab.dataset.tab).classList.remove("hidden");
  });
});

// ---------- GM Streak ----------
document.getElementById("checkInBtn").addEventListener("click", doCheckIn);

async function refreshStreakInfo() {
  if (!gmContract || !userAddress) return;
  try {
    const info = await gmContract.getStreakInfo(userAddress);
    document.getElementById("streakNum").textContent = info.currentStreak.toString();
    document.getElementById("bestStreak").textContent = info.best.toString();
    document.getElementById("totalCheckins").textContent = info.totalCheckInsCount.toString();

    if (info.checkedInToday) {
      document.getElementById("checkInBtn").disabled = true;
      document.getElementById("checkInBtn").textContent = "Already checked in today ✅";
    } else {
      document.getElementById("checkInBtn").disabled = false;
      document.getElementById("checkInBtn").textContent = "GM ☀️";
    }

    startCountdown(Number(info.secondsUntilReset));

    const badges = await gmContract.getBadges(userAddress);
    document.querySelectorAll(".badge").forEach((el, i) => {
      if (badges.owned[i]) el.classList.add("earned");
      else el.classList.remove("earned");
    });
  } catch (err) {
    console.error(err);
  }
}

function startCountdown(seconds) {
  clearInterval(countdownInterval);
  let remaining = seconds;
  updateCountdownDisplay(remaining);
  countdownInterval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(countdownInterval);
      refreshStreakInfo();
      return;
    }
    updateCountdownDisplay(remaining);
  }, 1000);
}

function updateCountdownDisplay(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600).toString().padStart(2, "0");
  const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  document.getElementById("countdown").textContent = `${h}:${m}:${s}`;
}

async function doCheckIn() {
  if (!gmContract) return;
  const btn = document.getElementById("checkInBtn");
  btn.disabled = true;
  btn.textContent = "Confirm in wallet...";
  try {
    const tx = await gmContract.checkIn();
    showStatus("gmStatus", "Transaction sent, waiting for confirmation...", "info");
    await tx.wait();
    showStatus("gmStatus", "Check-in successful! 🎉", "success");
    refreshStreakInfo();
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = "GM ☀️";
    showStatus("gmStatus", "Error: " + (err.reason || err.message || "Transaction failed"), "error");
  }
}

// ---------- Messages ----------
const msgInput = document.getElementById("msgInput");
msgInput.addEventListener("input", () => {
  document.getElementById("charCount").textContent = msgInput.value.length;
});

document.getElementById("postMsgBtn").addEventListener("click", postMessage);

async function postMessage() {
  if (!messagesContract || !usdcContract) {
    showStatus("msgStatus", "Messages contract not configured yet.", "error");
    return;
  }
  const text = msgInput.value.trim();
  if (!text) return;

  const btn = document.getElementById("postMsgBtn");
  btn.disabled = true;
  try {
    const fee = await messagesContract.messageFee();
    const allowance = await usdcContract.allowance(userAddress, CONFIG.contracts.onchainMessages);

    if (allowance < fee) {
      btn.textContent = "Approving USDC...";
      showStatus("msgStatus", "Step 1: confirm the USDC approval...", "info");
      const approveTx = await usdcContract.approve(CONFIG.contracts.onchainMessages, fee * 1000n);
      await approveTx.wait();
    }

    btn.textContent = "Sending message...";
    showStatus("msgStatus", "Sending your message...", "info");
    const tx = await messagesContract.postMessage(text);
    await tx.wait();

    showStatus("msgStatus", "Message posted! 🎉", "success");
    msgInput.value = "";
    document.getElementById("charCount").textContent = "0";
    loadRecentMessages();
  } catch (err) {
    console.error(err);
    showStatus("msgStatus", "Error: " + (err.reason || err.message || "Transaction failed"), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Post (0.001 USDC)";
  }
}

async function loadRecentMessages() {
  if (!messagesContract) return;
  try {
    const result = await messagesContract.getRecentMessages(0, 20);
    const list = document.getElementById("messageList");
    list.innerHTML = "";
    for (let i = 0; i < result.texts.length; i++) {
      const item = document.createElement("div");
      item.className = "message-item";
      const author = result.authors[i];
      const time = new Date(Number(result.timestamps[i]) * 1000).toLocaleString();
      item.innerHTML = `
        <div class="author">${author.slice(0,6)}...${author.slice(-4)}</div>
        <div class="text">${escapeHtml(result.texts[i])}</div>
        <div class="time">${time}</div>
      `;
      list.appendChild(item);
    }
  } catch (err) {
    console.error(err);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Swap (placeholder — wired up once AerodromeSwapFee is deployed) ----------
document.getElementById("swapBtn").addEventListener("click", () => {
  showStatus("swapStatus", "Swap contract not deployed yet.", "info");
});

// ---------- Helpers ----------
function showStatus(elId, message, type) {
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 6000);
}
</script>
</body>
</html>
