<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basepulse</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --card: #12182a;
    --border: #232b42;
    --blue: #0052ff;
    --blue-light: #4c8bff;
    --text: #e8ecf4;
    --text-dim: #8992a9;
    --green: #2ecc71;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0e1830 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  #connectBtn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }
  #connectBtn:hover { opacity: .85; }
  #connectBtn.connected { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
  }
  .tab.active { background: var(--blue); color: white; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* GM Streak */
  .streak-hero { text-align: center; padding: 12px 0 20px; }
  .streak-number {
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #4c8bff, #0052ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .streak-label { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .stats-row { display: flex; gap: 10px; margin: 18px 0; }
  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-box .val { font-size: 20px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .countdown {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .countdown span { color: var(--blue-light); font-weight: 700; font-variant-numeric: tabular-nums; }
  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  .badges-row { display: flex; gap: 10px; margin-top: 18px; }
  .badge {
    flex: 1;
    text-align: center;
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    opacity: 0.35;
  }
  .badge.earned { opacity: 1; border-color: var(--blue); background: rgba(0,82,255,0.1); }
  .badge .emoji { font-size: 22px; }
  .badge .days { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* Messages */
  textarea {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    min-height: 90px;
  }
  .char-count { text-align: right; font-size: 12px; color: var(--text-dim); margin: 6px 0 14px; }
  .fee-note { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }

  /* Swap */
  .swap-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .swap-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .swap-row input {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    width: 100%;
    outline: none;
  }
  select.token-select {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 600;
    font-size: 13px;
  }
  .swap-arrow { text-align: center; margin: 6px 0; color: var(--text-dim); font-size: 18px; }

  .status-msg {
    text-align: center;
    font-size: 13px;
    padding: 10px;
    border-radius: 10px;
    margin-top: 12px;
  }
  .status-msg.info { background: rgba(76,139,255,0.1); color: var(--blue-light); }
  .status-msg.success { background: rgba(46,204,113,0.1); color: var(--green); }
  .status-msg.error { background: rgba(255,92,92,0.1); color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>Basepulse</div>
    <button id="connectBtn">Connect Wallet</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="gm">GM Streak</div>
    <div class="tab" data-tab="messages">Messages</div>
    <div class="tab" data-tab="swap">Swap</div>
  </div>

  <!-- GM STREAK TAB -->
  <section id="tab-gm">
    <div class="card">
      <h2>Your Streak</h2>
      <div class="streak-hero">
        <div class="streak-number" id="streakNum">0</div>
        <div class="streak-label">days in a row</div>
      </div>
      <div class="countdown">Resets in <span id="countdown">--:--:--</span></div>
      <div class="stats-row">
        <div class="stat-box"><div class="val" id="bestStreak">0</div><div class="lbl">Best Streak</div></div>
        <div class="stat-box"><div class="val" id="totalCheckins">0</div><div class="lbl">Total Check-ins</div></div>
      </div>
      <button class="btn-primary" id="checkInBtn" disabled>Connect wallet first</button>
      <div class="badges-row">
        <div class="badge" data-days="7"><div class="emoji">🥉</div><div class="days">7 days</div></div>
        <div class="badge" data-days="30"><div class="emoji">🥈</div><div class="days">30 days</div></div>
        <div class="badge" data-days="100"><div class="emoji">🥇</div><div class="days">100 days</div></div>
        <div class="badge" data-days="365"><div class="emoji">🏆</div><div class="days">365 days</div></div>
      </div>
      <div id="gmStatus"></div>
    </div>
  </section>

  <!-- MESSAGES TAB -->
  <section id="tab-messages" class="hidden">
    <div class="card">
      <h2>Post a message</h2>
      <textarea id="msgInput" maxlength="280" placeholder="What's happening onchain?"></textarea>
      <div class="char-count"><span id="charCount">0</span>/280</div>
      <div class="fee-note">Fee: 0.001 ETH</div>
      <button class="btn-primary" id="postMsgBtn" disabled>Connect wallet first</button>
      <div id="msgStatus"></div>
    </div>
  </section>

  <!-- SWAP TAB -->
  <section id="tab-swap" class="hidden">
    <div class="card">
      <h2>Swap</h2>
      <div class="swap-box">
        <div class="swap-row">
          <input type="number" id="swapAmountIn" placeholder="0.0">
          <select class="token-select"><option value="ETH">ETH</option></select>
        </div>
      </div>
      <div class="swap-arrow">↓</div>
      <div class="swap-box">
        <div class="swap-row">
          <input type="number" id="swapAmountOut" placeholder="0.0" disabled>
          <select class="token-select"><option value="USDC">USDC</option></select>
        </div>
      </div>
      <br>
      <button class="btn-primary" id="swapBtn" disabled>Connect wallet first</button>
      <div id="swapStatus"></div>
    </div>
  </section>
</div>

<script>
const CONFIG = {
  chainIdHex: "0x2105", // Base Mainnet (8453)
  gmStreakContract: "0xea35fa5803EEAcc6195D32078a001834fe790c9A"
};

const GM_STREAK_ABI = [
  "function checkIn() external",
  "function getStreakInfo(address user) view returns (uint256 currentStreak, uint256 best, uint256 totalCheckInsCount, bool checkedInToday, uint256 nextResetAt, uint256 secondsUntilReset)",
  "function getBadges(address user) view returns (bool[] owned, uint256[] milestoneDays)"
];

let provider, signer, userAddress, gmContract;

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("connectBtn").addEventListener("click", connectWallet);
  
  // Tab Değiştirme Mantığı
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll("section[id^='tab-']").forEach(s => s.classList.add("hidden"));
      document.getElementById("tab-" + tab.dataset.tab).classList.remove("hidden");
    });
  });
});

async function connectWallet() {
  if (!window.ethereum) {
    alert("Please install MetaMask or Coinbase Wallet!");
    return;
  }

  try {
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    userAddress = accounts[0];

    // Cüzdan bağlandıktan sonra tüm butonları aktif et
    updateUIOnConnect();

    // Ethers kurulumu
    if (window.ethers) {
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      gmContract = new ethers.Contract(CONFIG.gmStreakContract, GM_STREAK_ABI, signer);
      refreshStreakInfo();
    }
  } catch (err) {
    console.error("Wallet connection error:", err);
  }
}

function updateUIOnConnect() {
  const shortAddr = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
  const connectBtn = document.getElementById("connectBtn");
  connectBtn.textContent = shortAddr;
  connectBtn.classList.add("connected");

  // Tüm Sekmelerdeki Butonları Aktifleştir
  const gmBtn = document.getElementById("checkInBtn");
  gmBtn.disabled = false;
  gmBtn.textContent = "GM ☀️";

  const msgBtn = document.getElementById("postMsgBtn");
  msgBtn.disabled = false;
  msgBtn.textContent = "Post Message";

  const swapBtn = document.getElementById("swapBtn");
  swapBtn.disabled = false;
  swapBtn.textContent = "Swap Tokens";
}

async function refreshStreakInfo() {
  if (!gmContract || !userAddress) return;
  try {
    const info = await gmContract.getStreakInfo(userAddress);
    document.getElementById("streakNum").textContent = info.currentStreak.toString();
    document.getElementById("bestStreak").textContent = info.best.toString();
    document.getElementById("totalCheckins").textContent = info.totalCheckInsCount.toString();

    if (info.checkedInToday) {
      const btn = document.getElementById("checkInBtn");
      btn.disabled = true;
      btn.textContent = "Checked in today ✅";
    }
  } catch (err) {
    // Kontrat adresi yanlışsa veya Base ağında değilse sessizce yakala
    console.warn("Could not fetch streak info from contract:", err);
  }
}

// GM Check-in İşlemi
document.getElementById("checkInBtn").addEventListener("click", async () => {
  if (!gmContract) return;
  const btn = document.getElementById("checkInBtn");
  btn.disabled = true;
  btn.textContent = "Confirming...";

  try {
    const tx = await gmContract.checkIn();
    await tx.wait();
    btn.textContent = "Checked in today ✅";
    refreshStreakInfo();
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = "GM ☀️";
    alert("Check-in transaction failed!");
  }
});
</script>
</body>
</html>
