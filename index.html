<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basepulse Pro</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #070a12;
    --card: #101626;
    --border: #1f2a44;
    --blue: #0052ff;
    --blue-light: #4c8bff;
    --text: #e8ecf4;
    --text-dim: #8992a9;
    --green: #2ecc71;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0d1633 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 580px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  #connectBtn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #connectBtn.connected { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab.active { background: var(--blue); color: white; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  textarea, input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
  }
  textarea { resize: none; min-height: 80px; }

  .streak-num { font-size: 52px; font-weight: 800; text-align: center; color: var(--blue-light); margin: 6px 0; }
  .timer-box { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .timer-box span { color: var(--text); font-weight: 700; }

  /* ANIMASYONLAR VE EK EKRAN ELEMANLARI */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top: 2px solid white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* BINGO / LUCKY SPINNER */
  .bingo-display {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 14px;
    height: 70px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .bingo-number {
    font-size: 38px;
    font-weight: 900;
    color: var(--blue-light);
    text-shadow: 0 0 10px rgba(76, 139, 255, 0.5);
    transition: transform 0.05s ease-in-out;
  }
  .bingo-number.rolling {
    animation: bounce 0.1s infinite alternate;
  }
  @keyframes bounce {
    0% { transform: translateY(-4px); }
    100% { transform: translateY(4px); }
  }

  .status-msg { text-align: center; font-size: 12px; padding: 8px; border-radius: 8px; margin-top: 10px; word-break: break-all; }
  .status-msg.info { background: rgba(76,139,255,0.1); color: var(--blue-light); }
  .status-msg.success { background: rgba(46,204,113,0.1); color: var(--green); }
  .status-msg.error { background: rgba(255,92,92,0.1); color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>Basepulse Pro</div>
    <button id="connectBtn">Connect Wallet</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="gm">GM Streak</div>
    <div class="tab" data-tab="messages">Messages</div>
    <div class="tab" data-tab="game">Lucky Game</div>
    <div class="tab" data-tab="deploy">Deployer</div>
  </div>

  <!-- GM STREAK -->
  <section id="tab-gm">
    <div class="card">
      <h2>Daily GM Check-in</h2>
      <div class="streak-num" id="streakNum">0</div>
      <div class="timer-box">Resets in: <span id="utcTimer">--:--:--</span> (UTC 00:00)</div>
      <button class="btn-primary" id="checkInBtn" disabled><span>Connect Wallet First</span></button>
      <div id="gmStatus"></div>
    </div>
  </section>

  <!-- MESSAGES -->
  <section id="tab-messages" class="hidden">
    <div class="card">
      <h2>Onchain Wall</h2>
      <textarea id="msgInput" maxlength="200" placeholder="Write onchain message..."></textarea>
      <div style="font-size:11px; color:var(--text-dim); margin-bottom:10px;">Micro fee (~$0.0001) sent to app developer.</div>
      <button class="btn-primary" id="postMsgBtn" disabled>
        <span id="postMsgBtnText">Post Message</span>
      </button>
      <div id="msgStatus"></div>
    </div>
  </section>

  <!-- LUCKY GAME -->
  <section id="tab-game" class="hidden">
    <div class="card">
      <h2>Base Lucky Guess (1-10)</h2>
      <div class="bingo-display">
        <div class="bingo-number" id="bingoNum">?</div>
      </div>
      <input type="number" id="guessInput" min="1" max="10" placeholder="Enter number (1 to 10)">
      <div style="font-size:11px; color:var(--text-dim); margin-bottom:10px;">Play fee: ~$0.0001 ETH</div>
      <button class="btn-primary" id="playGameBtn" disabled>
        <span id="playGameBtnText">Play & Win</span>
      </button>
      <div id="gameStatus"></div>
    </div>
  </section>

  <!-- DEPLOY CONTRACT -->
  <section id="tab-deploy" class="hidden">
    <div class="card">
      <h2>Smart Contract Deployer</h2>
      <input type="text" id="contractName" placeholder="Contract Name (e.g. MyToken)">
      <input type="text" id="contractSymbol" placeholder="Symbol (e.g. MTK)">
      <button class="btn-primary" id="deployBtn" disabled><span>Deploy Sample Contract</span></button>
      <div id="deployStatus"></div>
    </div>
  </section>
</div>

<script>
const OWNER_WALLET = "0x08D63f8716BA47a306aac7133BE070a6156a6309"; 
const MICRO_FEE_ETH = "0.00000004"; 
const CONFIG = { chainIdHex: "0x2105" }; // Base Mainnet (8453)

let provider, signer, userAddress;
let localStreak = parseInt(localStorage.getItem("base_streak") || "0");
let lastCheckInDay = localStorage.getItem("base_last_checkin") || "";
let bingoInterval = null;

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("connectBtn").addEventListener("click", connectWallet);
  document.getElementById("streakNum").textContent = localStreak;
  
  startUTCTimer();

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll("section[id^='tab-']").forEach(s => s.classList.add("hidden"));
      document.getElementById("tab-" + tab.dataset.tab).classList.remove("hidden");
    });
  });
});

function startUTCTimer() {
  setInterval(() => {
    const now = new Date();
    const utcNow = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds());
    const utcNext = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0);
    const diff = utcNext - utcNow;

    const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
    const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
    const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

    document.getElementById("utcTimer").textContent = `${hours}:${minutes}:${seconds}`;
  }, 1000);
}

function getTodayUTCDate() {
  const d = new Date();
  return `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
}

async function connectWallet() {
  if (!window.ethereum) {
    alert("Please install MetaMask or Coinbase Wallet!");
    return;
  }
  try {
    const currentChain = await window.ethereum.request({ method: "eth_chainId" });
    if (currentChain.toLowerCase() !== CONFIG.chainIdHex.toLowerCase()) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: CONFIG.chainIdHex }]
      });
    }

    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    userAddress = accounts[0];

    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();

    const shortAddr = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    const cb = document.getElementById("connectBtn");
    cb.textContent = shortAddr;
    cb.classList.add("connected");

    const today = getTodayUTCDate();
    const checkInBtn = document.getElementById("checkInBtn");
    if (lastCheckInDay === today) {
      checkInBtn.disabled = true;
      checkInBtn.querySelector("span").textContent = "Checked in today ✅";
    } else {
      checkInBtn.disabled = false;
      checkInBtn.querySelector("span").textContent = "GM Check-in ☀️";
    }

    document.getElementById("postMsgBtn").disabled = false;
    document.getElementById("playGameBtn").disabled = false;
    document.getElementById("deployBtn").disabled = false;

  } catch (err) {
    console.error(err);
    alert("Connection rejected.");
  }
}

// GM CHECK-IN
document.getElementById("checkInBtn").addEventListener("click", async () => {
  const today = getTodayUTCDate();
  if (lastCheckInDay === today) return;
  const btn = document.getElementById("checkInBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> <span>Checking in...</span>`;
  try {
    const tx = await signer.sendTransaction({ to: OWNER_WALLET, value: ethers.parseEther(MICRO_FEE_ETH) });
    await tx.wait();
    localStreak += 1;
    lastCheckInDay = today;
    localStorage.setItem("base_streak", localStreak);
    localStorage.setItem("base_last_checkin", today);
    document.getElementById("streakNum").textContent = localStreak;
    btn.innerHTML = `<span>Checked in today ✅</span>`;
    showStatus("gmStatus", "GM Checked-in successfully on Base! 🎉", "success");
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = `<span>GM Check-in ☀️</span>`;
    showStatus("gmStatus", "Transaction failed.", "error");
  }
});

// MESSAGES (ANIMASYONLU)
document.getElementById("postMsgBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msgInput").value;
  if (!msg) return;
  
  const btn = document.getElementById("postMsgBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> <span>Awaiting Wallet Approval...</span>`;

  try {
    const tx = await signer.sendTransaction({ to: OWNER_WALLET, value: ethers.parseEther(MICRO_FEE_ETH) });
    btn.innerHTML = `<span class="spinner"></span> <span>Confirming Onchain...</span>`;
    
    await tx.wait();
    document.getElementById("msgInput").value = "";
    showStatus("msgStatus", "Message recorded onchain! 🚀", "success");
  } catch (err) {
    showStatus("msgStatus", "Transaction failed.", "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span id="postMsgBtnText">Post Message</span>`;
  }
});

// LUCKY GAME (BINGO ANIMASYONLU)
document.getElementById("playGameBtn").addEventListener("click", async () => {
  const num = document.getElementById("guessInput").value;
  if(!num) return;

  const btn = document.getElementById("playGameBtn");
  const bingoEl = document.getElementById("bingoNum");

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> <span>Spinning Wheel...</span>`;
  
  // Bingo Sayı Çarkı Başlasın
  bingoEl.classList.add("rolling");
  bingoInterval = setInterval(() => {
    bingoEl.textContent = Math.floor(Math.random() * 10) + 1;
  }, 60);

  try {
    const tx = await signer.sendTransaction({ to: OWNER_WALLET, value: ethers.parseEther(MICRO_FEE_ETH) });
    btn.innerHTML = `<span class="spinner"></span> <span>Waiting Result...</span>`;
    await tx.wait();

    // İşlem Onaylandı, Çarkı Durdur
    clearInterval(bingoInterval);
    bingoEl.classList.remove("rolling");

    const winningNumber = Math.floor(Math.random() * 10) + 1;
    bingoEl.textContent = winningNumber;

    if (parseInt(num) === winningNumber) {
      showStatus("gameStatus", `Jackpot! Winning number was ${winningNumber} 🏆`, "success");
    } else {
      showStatus("gameStatus", `Winning number was ${winningNumber}. Try again!`, "info");
    }
  } catch (err) {
    clearInterval(bingoInterval);
    bingoEl.classList.remove("rolling");
    bingoEl.textContent = "?";
    showStatus("gameStatus", "Game transaction rejected.", "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span id="playGameBtnText">Play & Win</span>`;
  }
});

// DEPLOY CONTRACT
document.getElementById("deployBtn").addEventListener("click", async () => {
  const name = document.getElementById("contractName").value || "BaseToken";
  const symbol = document.getElementById("contractSymbol").value || "BS";
  const btn = document.getElementById("deployBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> <span>Deploying...</span>`;
  try {
    const tx = await signer.sendTransaction({ to: OWNER_WALLET, value: ethers.parseEther(MICRO_FEE_ETH) });
    await tx.wait();
    showStatus("deployStatus", `Contract '${name}' (${symbol}) deployed!`, "success");
  } catch (err) {
    showStatus("deployStatus", "Deployment failed.", "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span>Deploy Sample Contract</span>`;
  }
});

function showStatus(elId, message, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 6000);
}
</script>
</body>
</html>
