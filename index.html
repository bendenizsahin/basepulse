<script>
const CONFIG = {
  chainIdHex: "0x2105", // Base Mainnet Hex (8453)
  chainName: "Base Mainnet",
  rpcUrl: "https://mainnet.base.org",
  blockExplorerUrl: "https://basescan.org",
  nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
  contracts: {
    gmStreak: "0xea35fa5803EEAcc6195D32078a001834fe790c9A",
    onchainMessages: "",
    aerodromeSwap: "",
    usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
  }
};

const GM_STREAK_ABI = [
  "function checkIn() external",
  "function getStreakInfo(address user) view returns (uint256 currentStreak, uint256 best, uint256 totalCheckInsCount, bool checkedInToday, uint256 nextResetAt, uint256 secondsUntilReset)",
  "function getBadges(address user) view returns (bool[] owned, uint256[] milestoneDays)"
];

const ONCHAIN_MESSAGES_ABI = [
  "function postMessage(string text) external",
  "function messageFee() view returns (uint256)",
  "function getRecentMessages(uint256 offset, uint256 limit) view returns (address[] authors, string[] texts, uint256[] timestamps)"
];

const USDC_ABI = [
  "function approve(address spender, uint256 amount) external returns (bool)",
  "function allowance(address owner, address spender) view returns (uint256)"
];

let provider, signer, userAddress;
let gmContract, messagesContract, usdcContract;
let countdownInterval;

// Doğrudan buton seçilip olay atanıyor (DOMContentLoaded kaldırıldı)
const connectBtn = document.getElementById("connectBtn");
connectBtn.addEventListener("click", connectWallet);

async function connectWallet() {
  showStatus("gmStatus", "Cüzdan bağlantısı başlatılıyor...", "info");

  if (typeof window.ethereum === "undefined") {
    alert("MetaMask veya başka bir Web3 cüzdanı bulunamadı. Lütfen bir cüzdan eklentisi yükleyin!");
    showStatus("gmStatus", "Cüzdan eklentisi bulunamadı.", "error");
    return;
  }

  let injected = window.ethereum;
  if (window.ethereum?.providers?.length) {
    injected = window.ethereum.providers.find(p => p.isMetaMask) || window.ethereum.providers[0];
  }

  try {
    const accounts = await injected.request({ method: "eth_requestAccounts" });
    userAddress = accounts[0];

    if (typeof ethers === "undefined") {
      alert("Ethers.js kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edin.");
      return;
    }

    provider = new ethers.BrowserProvider(injected);
    signer = await provider.getSigner();

    const network = await provider.getNetwork();
    const currentChainIdHex = "0x" + network.chainId.toString(16);

    if (currentChainIdHex.toLowerCase() !== CONFIG.chainIdHex.toLowerCase()) {
      try {
        await injected.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: CONFIG.chainIdHex }]
        });
      } catch (switchError) {
        if (switchError.code === 4902) {
          try {
            await injected.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: CONFIG.chainIdHex,
                chainName: CONFIG.chainName,
                rpcUrls: [CONFIG.rpcUrl],
                nativeCurrency: CONFIG.nativeCurrency,
                blockExplorerUrls: [CONFIG.blockExplorerUrl]
              }]
            });
          } catch (addError) {
            showStatus("gmStatus", "Ağ cüzdana eklenemedi.", "error");
            return;
          }
        } else {
          showStatus("gmStatus", "Lütfen cüzdandan Base ağını seçin.", "error");
          return;
        }
      }
    }

    connectBtn.textContent = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
    connectBtn.classList.add("connected");

    initContracts();
    refreshStreakInfo();

    document.getElementById("checkInBtn").disabled = false;
    document.getElementById("postMsgBtn").disabled = false;
    document.getElementById("swapBtn").disabled = false;
    document.getElementById("checkInBtn").textContent = "GM ☀️";
    document.getElementById("postMsgBtn").textContent = "Post (0.001 USDC)";
    document.getElementById("swapBtn").textContent = "Swap";
    
    showStatus("gmStatus", "Cüzdan başarıyla bağlandı!", "success");

  } catch (err) {
    console.error("Bağlantı Hatası:", err);
    showStatus("gmStatus", "Hata: " + (err.message || "Bağlantı reddedildi"), "error");
  }
}

function initContracts() {
  if (CONFIG.contracts.gmStreak && signer) {
    gmContract = new ethers.Contract(CONFIG.contracts.gmStreak, GM_STREAK_ABI, signer);
  }
  if (CONFIG.contracts.onchainMessages && signer) {
    messagesContract = new ethers.Contract(CONFIG.contracts.onchainMessages, ONCHAIN_MESSAGES_ABI, signer);
  }
  if (CONFIG.contracts.usdc && signer) {
    usdcContract = new ethers.Contract(CONFIG.contracts.usdc, USDC_ABI, signer);
  }
}

// Tabs
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll("section[id^='tab-']").forEach(s => s.classList.add("hidden"));
    document.getElementById("tab-" + tab.dataset.tab).classList.remove("hidden");
  });
});

// GM Streak
document.getElementById("checkInBtn").addEventListener("click", doCheckIn);

async function refreshStreakInfo() {
  if (!gmContract || !userAddress) return;
  try {
    const info = await gmContract.getStreakInfo(userAddress);
    document.getElementById("streakNum").textContent = info.currentStreak.toString();
    document.getElementById("bestStreak").textContent = info.best.toString();
    document.getElementById("totalCheckins").textContent = info.totalCheckInsCount.toString();

    if (info.checkedInToday) {
      document.getElementById("checkInBtn").disabled = true;
      document.getElementById("checkInBtn").textContent = "Already checked in today ✅";
    } else {
      document.getElementById("checkInBtn").disabled = false;
      document.getElementById("checkInBtn").textContent = "GM ☀️";
    }

    startCountdown(Number(info.secondsUntilReset));

    const badges = await gmContract.getBadges(userAddress);
    document.querySelectorAll(".badge").forEach((el, i) => {
      if (badges.owned[i]) el.classList.add("earned");
      else el.classList.remove("earned");
    });
  } catch (err) {
    console.error(err);
  }
}

function startCountdown(seconds) {
  clearInterval(countdownInterval);
  let remaining = seconds;
  updateCountdownDisplay(remaining);
  countdownInterval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(countdownInterval);
      refreshStreakInfo();
      return;
    }
    updateCountdownDisplay(remaining);
  }, 1000);
}

function updateCountdownDisplay(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600).toString().padStart(2, "0");
  const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  document.getElementById("countdown").textContent = `${h}:${m}:${s}`;
}

async function doCheckIn() {
  if (!gmContract) return;
  const btn = document.getElementById("checkInBtn");
  btn.disabled = true;
  btn.textContent = "Confirm in wallet...";
  try {
    const tx = await gmContract.checkIn();
    showStatus("gmStatus", "Transaction sent, waiting for confirmation...", "info");
    await tx.wait();
    showStatus("gmStatus", "Check-in successful! 🎉", "success");
    refreshStreakInfo();
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = "GM ☀️";
    showStatus("gmStatus", "Error: " + (err.reason || err.message || "Transaction failed"), "error");
  }
}

// Messages
const msgInput = document.getElementById("msgInput");
msgInput.addEventListener("input", () => {
  document.getElementById("charCount").textContent = msgInput.value.length;
});

document.getElementById("postMsgBtn").addEventListener("click", postMessage);

async function postMessage() {
  if (!messagesContract || !usdcContract) {
    showStatus("msgStatus", "Messages contract not configured yet.", "error");
    return;
  }
  const text = msgInput.value.trim();
  if (!text) return;

  const btn = document.getElementById("postMsgBtn");
  btn.disabled = true;
  try {
    const fee = await messagesContract.messageFee();
    const allowance = await usdcContract.allowance(userAddress, CONFIG.contracts.onchainMessages);

    if (allowance < fee) {
      btn.textContent = "Approving USDC...";
      showStatus("msgStatus", "Step 1: confirm the USDC approval...", "info");
      const approveTx = await usdcContract.approve(CONFIG.contracts.onchainMessages, fee * 1000n);
      await approveTx.wait();
    }

    btn.textContent = "Sending message...";
    showStatus("msgStatus", "Sending your message...", "info");
    const tx = await messagesContract.postMessage(text);
    await tx.wait();

    showStatus("msgStatus", "Message posted! 🎉", "success");
    msgInput.value = "";
    document.getElementById("charCount").textContent = "0";
    loadRecentMessages();
  } catch (err) {
    console.error(err);
    showStatus("msgStatus", "Error: " + (err.reason || err.message || "Transaction failed"), "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Post (0.001 USDC)";
  }
}

async function loadRecentMessages() {
  if (!messagesContract) return;
  try {
    const result = await messagesContract.getRecentMessages(0, 20);
    const list = document.getElementById("messageList");
    list.innerHTML = "";
    for (let i = 0; i < result.texts.length; i++) {
      const item = document.createElement("div");
      item.className = "message-item";
      const author = result.authors[i];
      const time = new Date(Number(result.timestamps[i]) * 1000).toLocaleString();
      item.innerHTML = `
        <div class="author">${author.slice(0,6)}...${author.slice(-4)}</div>
        <div class="text">${escapeHtml(result.texts[i])}</div>
        <div class="time">${time}</div>
      `;
      list.appendChild(item);
    }
  } catch (err) {
    console.error(err);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Swap
document.getElementById("swapBtn").addEventListener("click", () => {
  showStatus("swapStatus", "Swap contract not deployed yet.", "info");
});

// Helper
function showStatus(elId, message, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 6000);
}
</script>
